<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stock Performance Dashboard</title>
  <link rel="stylesheet" href="./style.css?v=20260605-trend-grade" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="title-group">
        <h1 id="dashboardTitle">성과 대시보드</h1>
        <p id="dashboardDescription">Yahoo Finance 기준 기간별 성과와 등급을 확인합니다.</p>
      </div>
      <div class="header-actions">
        <button id="themeToggle" class="theme-toggle" type="button" aria-label="다크 모드로 전환" aria-pressed="false">
          <span class="theme-toggle-track" aria-hidden="true">
            <span class="theme-toggle-thumb"></span>
          </span>
          <span id="themeToggleLabel">다크</span>
        </button>
        <div class="header-meta">
          <span>Data Source</span>
          <b id="dataSourceName">Yahoo Finance</b>
          <small id="lastUpdated">마지막 업데이트: -</small>
        </div>
      </div>
    </header>

    <section id="statusBox" class="status-box hidden"></section>

    <nav id="assetTabs" class="asset-tabs" aria-label="데이터 종류 선택"></nav>

    <section class="toolbar" aria-label="데이터 필터">
      <input id="searchInput" type="search" placeholder="티커, 카테고리, 기간, 등급 검색" autocomplete="off" />
      <select id="periodFilter" aria-label="기간 필터"></select>
      <select id="gradeFilter" aria-label="등급 필터"></select>
      <select id="sortSelect" aria-label="정렬"></select>
      <button id="resetButton" class="reset-button" type="button">초기화</button>
    </section>

    <section id="kpiCards" class="kpi-grid" aria-label="주요 지표"></section>

    <section class="insight-grid">
      <article class="panel">
        <div class="panel-title">
          <div>
            <h2>등급 분포</h2>
            <p id="gradeSummaryText">-</p>
          </div>
        </div>
        <div id="gradeCounts" class="count-grid grade-grid"></div>
        <div id="gradeRatio" class="ratio-bar"></div>
      </article>

      <article class="panel">
        <div class="panel-title">
          <div>
            <h2 id="groupDistributionTitle">카테고리 분포</h2>
            <p id="periodSummaryText">-</p>
          </div>
        </div>
        <div id="periodCounts" class="count-grid period-grid"></div>
        <div id="periodRatio" class="ratio-bar"></div>
      </article>
    </section>

    <main class="table-panel expanded">
      <div class="table-title">
        <div>
          <h2 id="tableTitle">10년 성과</h2>
          <p id="tableSubtitle">data.json 컬럼 순서 기준으로 표시됩니다.</p>
        </div>
        <span id="rowCount" class="period-chip">0 rows</span>
      </div>
      <div class="table-wrap main-table-wrap">
        <table id="mainTable">
          <thead id="tableHead"></thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </main>
  </div>

  <aside id="detailDrawer" class="drawer" aria-label="상세 패널">
    <button id="closeDrawer" class="drawer-close" type="button" aria-label="상세 패널 닫기">&times;</button>
    <div class="drawer-header">
      <div>
        <h2 id="detailTicker">-</h2>
        <p id="detailSub">-</p>
      </div>
      <div id="detailBadges" class="detail-badges"></div>
    </div>

    <section class="drawer-section">
      <h3>기간별 날짜 및 등급</h3>
      <div id="periodSummaryCards" class="period-summary-grid"></div>
    </section>

    <section class="drawer-section">
      <h3>기간별 지표 상세</h3>
      <div id="periodMetricBars" class="metric-bars"></div>
    </section>
  </aside>

  <div id="overlay" class="overlay"></div>
  <script src="./app.js?v=20260605-trend-grade"></script>
</body>
</html>
